name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repo only keeps our own code; the android/ folder is generated here.
      - name: Generate Android project
        run: |
          mkdir -p "$RUNNER_TEMP/keep"
          cp -r lib test pubspec.yaml "$RUNNER_TEMP/keep/"
          flutter create . --org com.speedguardian --project-name speed_guardian --platforms=android
          rm -rf lib test pubspec.yaml
          cp -r "$RUNNER_TEMP/keep/." .
          python3 scripts/patch_android.py

      # Firebase settings come from repository secrets (Settings > Secrets and variables > Actions).
      - name: Write firebase_options.dart
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        run: |
          cat > lib/firebase_options.dart <<EOF
          import 'package:firebase_core/firebase_core.dart';

          class DefaultFirebaseOptions {
            static const FirebaseOptions currentPlatform = FirebaseOptions(
              apiKey: '${FIREBASE_API_KEY}',
              appId: '${FIREBASE_APP_ID}',
              messagingSenderId: '${FIREBASE_MESSAGING_SENDER_ID}',
              projectId: '${FIREBASE_PROJECT_ID}',
              storageBucket: '${FIREBASE_STORAGE_BUCKET}',
            );
          }
          EOF

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: speed-guardian-apk
          path: build/app/outputs/flutter-apk/app-release.apk
